<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 244" width="100%" role="img" aria-label="Outbox Polling Uncommitted Sequence Gap bug compared with WAL LSN Ordered CDC">
  <defs>
    <marker id="arr-d2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arr-d2-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="242" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="24" y="27" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.1">
    OUTBOX ORDERING TRAP // UNCOMMITTED SEQUENCE GAP VS. COMMIT-ORDERED WAL CDC
  </text>

  <!-- TOP TRACK: NAIVE IDENTITY POLLING -->
  <rect x="20" y="42" width="800" height="88" rx="6" fill="#161b22" stroke="#6e3630" stroke-width="1" />
  <text x="34" y="61" fill="#f78166" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    NAIVE POLLER (WHERE id &gt; last_seen_id) — SILENT DATA LOSS
  </text>

  <!-- TX1 slow id=10 -->
  <rect x="34" y="72" width="150" height="44" rx="4" fill="#0d1117" stroke="#f78166" stroke-dasharray="3 2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" />
  </rect>
  <text x="44" y="90" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">TX1 allocates id=10</text>
  <text x="44" y="106" fill="#f78166" font-family="ui-monospace, monospace" font-size="9">Commits LAST (+200ms)</text>

  <!-- TX2 fast id=11 -->
  <rect x="204" y="72" width="150" height="44" rx="4" fill="#0d1117" stroke="#3fb950" />
  <text x="214" y="90" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">TX2 allocates id=11</text>
  <text x="214" y="106" fill="#3fb950" font-family="ui-monospace, monospace" font-size="9">Commits FIRST (+10ms)</text>

  <line x1="354" y1="94" x2="394" y2="94" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr-d2)" />
  <circle cy="94" r="3" fill="#d29922">
    <animate attributeName="cx" values="356;390" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Poller advances cursor to 11 -->
  <rect x="398" y="72" width="198" height="44" rx="4" fill="#0d1117" stroke="#d29922" />
  <text x="408" y="90" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">Poller sees id=11 only</text>
  <text x="408" y="106" fill="#d29922" font-family="ui-monospace, monospace" font-size="9">Cursor jumps: last_id = 11</text>

  <line x1="596" y1="94" x2="634" y2="94" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr-d2)" />

  <!-- Lost Event 10 -->
  <rect x="638" y="72" width="166" height="44" rx="4" fill="#251315" stroke="#f78166">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite" />
  </rect>
  <text x="648" y="90" fill="#f78166" font-family="ui-monospace, monospace" font-size="10" font-weight="600">id=10 SKIPPED</text>
  <text x="648" y="106" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">Next poll: id &gt; 11 (Lost)</text>

  <!-- BOTTOM TRACK: WAL CDC -->
  <rect x="20" y="142" width="800" height="88" rx="6" fill="#161b22" stroke="#238636" stroke-width="1" />
  <text x="34" y="161" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    WAL-ORDERED CDC (DEBEZIUM PGOUTPUT) + INBOX DEDUP — ZERO GAP
  </text>

  <rect x="34" y="172" width="164" height="44" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="44" y="190" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">Postgres WAL Log</text>
  <text x="44" y="206" fill="#7ee787" font-family="ui-monospace, monospace" font-size="9">LSN 104(11) · LSN 108(10)</text>

  <line x1="198" y1="194" x2="238" y2="194" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d2-grn)" />
  <circle cy="194" r="3" fill="#3fb950">
    <animate attributeName="cx" values="200;234" dur="2.4s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0s" repeatCount="indefinite" />
  </circle>

  <rect x="242" y="172" width="168" height="44" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="252" y="190" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">Debezium CDC Relay</text>
  <text x="252" y="206" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="9">Emits in exact commit LSN</text>

  <line x1="410" y1="194" x2="450" y2="194" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d2-grn)" />
  <circle cy="194" r="3" fill="#58a6ff">
    <animate attributeName="cx" values="412;446" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <rect x="454" y="172" width="166" height="44" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="464" y="190" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">Kafka (Key: entity_id)</text>
  <text x="464" y="206" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">CooperativeStickyAssign</text>

  <line x1="620" y1="194" x2="658" y2="194" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d2-grn)" />
  <circle cy="194" r="3" fill="#3fb950">
    <animate attributeName="cx" values="622;654" dur="2.4s" begin="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.6s" repeatCount="indefinite" />
  </circle>

  <rect x="662" y="172" width="142" height="44" rx="4" fill="#0f2318" stroke="#3fb950" />
  <text x="672" y="190" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600">Inbox Table</text>
  <text x="672" y="206" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">10 &amp; 11 both safe</text>
</svg>
