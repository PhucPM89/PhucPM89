<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 236" width="100%" role="img" aria-label="Token Family Lineage handling cross-tab refresh race versus stolen replay revocation and PostgreSQL RLS">
  <defs>
    <marker id="arr-d4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arr-d4-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f78166" />
    </marker>
    <marker id="arr-d4-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="234" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="24" y="27" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.1">
    ZERO-TRUST SESSION LINEAGE // CROSS-TAB RACE VS. REUSE DETECTION &amp; TENANT RLS
  </text>

  <!-- TOP: LEGITIMATE PARALLEL TAB RACE -->
  <rect x="20" y="42" width="800" height="84" rx="6" fill="#161b22" stroke="#238636" stroke-width="1" />
  <text x="34" y="61" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    LEGITIMATE MULTI-TAB REFRESH RACE (SAME CLIENT + 5s GRACE WINDOW)
  </text>

  <rect x="34" y="72" width="160" height="42" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="44" y="89" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">Tab A + Tab B send J1</text>
  <text x="44" y="104" fill="#58a6ff" font-family="ui-monospace, monospace" font-size="9">Within 40ms · Tab mutex</text>

  <line x1="194" y1="93" x2="236" y2="93" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d4-grn)" />
  <circle cy="93" r="3" fill="#3fb950">
    <animate attributeName="cx" values="196;232" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite" />
  </circle>

  <rect x="240" y="72" width="222" height="42" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="250" y="89" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">Lineage: (F1, pred=J1) -&gt; J2</text>
  <text x="250" y="104" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">Tab B hits grace cache -&gt; gets J2</text>

  <line x1="462" y1="93" x2="504" y2="93" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d4-grn)" />

  <rect x="508" y="72" width="296" height="42" rx="4" fill="#0f2318" stroke="#3fb950" />
  <text x="518" y="89" fill="#7ee787" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">SESSION PRESERVED · ZERO FALSE LOGOUT</text>
  <text x="518" y="104" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">RLS DB Context: SET LOCAL app.tenant_id</text>

  <!-- BOTTOM: STOLEN REPLAY -->
  <rect x="20" y="138" width="800" height="84" rx="6" fill="#161b22" stroke="#6e3630" stroke-width="1" />
  <text x="34" y="157" fill="#f78166" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    STOLEN TOKEN REPLAY / ENVIRONMENT DRIFT (AFTER GRACE WINDOW)
  </text>

  <rect x="34" y="168" width="184" height="42" rx="4" fill="#0d1117" stroke="#f78166" stroke-dasharray="3 2" />
  <text x="44" y="185" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">Attacker replays old J1</text>
  <text x="44" y="200" fill="#f78166" font-family="ui-monospace, monospace" font-size="9">New fingerprint + past TTL</text>

  <line x1="218" y1="189" x2="262" y2="189" stroke="#f78166" stroke-width="1.3" marker-end="url(#arr-d4-red)" />
  <circle cy="189" r="3" fill="#f78166">
    <animate attributeName="cx" values="220;258" dur="2.2s" begin="0.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="0.4s" repeatCount="indefinite" />
  </circle>

  <rect x="266" y="168" width="234" height="42" rx="4" fill="#251315" stroke="#f78166">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
  </rect>
  <text x="276" y="185" fill="#f78166" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">FAMILY F1 REVOKED IMMEDIATELY</text>
  <text x="276" y="200" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">All descendant tokens (J1..Jn) killed</text>

  <line x1="500" y1="189" x2="540" y2="189" stroke="#f78166" stroke-width="1.3" marker-end="url(#arr-d4-red)" />

  <rect x="544" y="168" width="260" height="42" rx="4" fill="#0d1117" stroke="#d29922" />
  <text x="554" y="185" fill="#d29922" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">STEP-UP TOTP / SMS MFA CHALLENGE</text>
  <text x="554" y="200" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9">Re-verify identity before new family F2</text>
</svg>
