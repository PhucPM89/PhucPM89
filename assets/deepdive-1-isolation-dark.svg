<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 236" width="100%" role="img" aria-label="MVCC Write Skew under Snapshot Isolation compared with Serializable SSI and Conflict Sentinel locking">
  <defs>
    <marker id="arr-d1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8b949e" />
    </marker>
    <marker id="arr-d1-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f78166" />
    </marker>
    <marker id="arr-d1-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect x="1" y="1" width="838" height="234" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="24" y="27" fill="#8b949e" font-family="ui-monospace, monospace" font-size="10.5" letter-spacing="1.1">
    ISOLATION ANOMALY // WRITE SKEW UNDER SNAPSHOT ISOLATION VS. SERIALIZABLE / SENTINEL LOCK
  </text>

  <!-- LEFT PANEL: SNAPSHOT ISOLATION BUG -->
  <rect x="20" y="42" width="390" height="176" rx="6" fill="#161b22" stroke="#6e3630" stroke-width="1" />
  <text x="34" y="62" fill="#f78166" font-family="ui-monospace, monospace" font-size="10" font-weight="600">SNAPSHOT ISOLATION (REPEATABLE READ)</text>

  <!-- Shared snapshot box -->
  <rect x="34" y="74" width="122" height="44" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="42" y="92" fill="#8b949e" font-family="ui-monospace, monospace" font-size="9.5">Snapshot t0:</text>
  <text x="42" y="108" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="10">active = 1 (cap 2)</text>

  <!-- TX1 & TX2 parallel write disjoint rows -->
  <line x1="156" y1="86" x2="206" y2="86" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr-d1)" />
  <line x1="156" y1="108" x2="206" y2="140" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr-d1)" />

  <circle cy="86" r="3" fill="#58a6ff">
    <animate attributeName="cx" values="158;202" dur="4s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#58a6ff">
    <animate attributeName="cx" values="158;202" dur="4s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="cy" values="108;138" dur="4s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.2s" repeatCount="indefinite" />
  </circle>

  <rect x="210" y="70" width="184" height="34" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="218" y="85" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">TX1: INSERT Row A</text>
  <text x="342" y="85" fill="#3fb950" font-family="ui-monospace, monospace" font-size="9.5">COMMIT</text>
  <text x="218" y="98" fill="#8b949e" font-family="ui-monospace, monospace" font-size="8.5">No write-write conflict</text>

  <rect x="210" y="122" width="184" height="34" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="218" y="137" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">TX2: INSERT Row B</text>
  <text x="342" y="137" fill="#3fb950" font-family="ui-monospace, monospace" font-size="9.5">COMMIT</text>
  <text x="218" y="150" fill="#8b949e" font-family="ui-monospace, monospace" font-size="8.5">Disjoint row passes check</text>

  <!-- Result alert -->
  <rect x="34" y="170" width="360" height="34" rx="4" fill="#251315" stroke="#f78166" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="46" y="191" fill="#f78166" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    WRITE SKEW: active = 3 &gt; cap 2 (Invariant silently broken)
  </text>

  <!-- RIGHT PANEL: SERIALIZABLE / CONFLICT SENTINEL -->
  <rect x="430" y="42" width="390" height="176" rx="6" fill="#161b22" stroke="#238636" stroke-width="1" />
  <text x="444" y="62" fill="#3fb950" font-family="ui-monospace, monospace" font-size="10" font-weight="600">SERIALIZABLE (SSI) OR PARENT FOR UPDATE</text>

  <!-- Sentinel Box -->
  <rect x="444" y="74" width="126" height="44" rx="4" fill="#0d1117" stroke="#3fb950">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
  </rect>
  <text x="452" y="92" fill="#7ee787" font-family="ui-monospace, monospace" font-size="9.5">Conflict Sentinel:</text>
  <text x="452" y="108" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">Parent FOR UPDATE</text>

  <line x1="570" y1="86" x2="616" y2="86" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-d1-grn)" />
  <line x1="570" y1="108" x2="616" y2="140" stroke="#f78166" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#arr-d1-red)" />

  <circle cy="86" r="3" fill="#3fb950">
    <animate attributeName="cx" values="572;612" dur="4s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1s" repeatCount="indefinite" />
  </circle>

  <rect x="620" y="70" width="186" height="34" rx="4" fill="#0d1117" stroke="#238636" />
  <text x="628" y="85" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">TX1: Locks + Inserts A</text>
  <text x="760" y="85" fill="#3fb950" font-family="ui-monospace, monospace" font-size="9.5">COMMIT</text>
  <text x="628" y="98" fill="#7ee787" font-family="ui-monospace, monospace" font-size="8.5">active = 2 (within cap)</text>

  <rect x="620" y="122" width="186" height="34" rx="4" fill="#0d1117" stroke="#9e6a03" />
  <text x="628" y="137" fill="#f0f6fc" font-family="ui-monospace, monospace" font-size="9.5">TX2: rw-cycle / blocked</text>
  <text x="762" y="137" fill="#d29922" font-family="ui-monospace, monospace" font-size="9.5">40001</text>
  <text x="628" y="150" fill="#d29922" font-family="ui-monospace, monospace" font-size="8.5">Aborts &amp; re-reads active=2</text>

  <rect x="444" y="170" width="362" height="34" rx="4" fill="#0f2318" stroke="#3fb950" stroke-width="1" />
  <text x="456" y="191" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10" font-weight="600">
    INVARIANT HELD: active &lt;= 2 (Zero ghost cap overflow)
  </text>
</svg>
